# Optional: use with the pre-commit framework (https://pre-commit.com).
#   pip install pre-commit && pre-commit install
#
# This runs the code-quality gate on staged files before each commit.
repos:
  - repo: local
    hooks:
      - id: code-quality-gate
        name: code-quality gate (complexity & maintainability)
        entry: python3 scripts/code-quality.py analyze --staged --gate --format text
        language: system
        pass_filenames: false
        always_run: true
